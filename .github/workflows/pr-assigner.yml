name: PR Auto-Assignment
run-name: "Assigning reviewers for PR #${{ github.event.pull_request.number }}"
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  prepare-config:
    runs-on: ubuntu-latest
    outputs:
      restricted-actor: ${{ steps.resolve.outputs.restricted-actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve restricted actor
        id: resolve
        env:
          ACTOR: ${{ github.actor }}
        run: |
          restricted=false
          if [ -f .github/config/build-config.yaml ] && grep -Fxq "  - ${ACTOR}" .github/config/build-config.yaml; then
            restricted=true
          fi
          echo "restricted-actor=${restricted}" >> "$GITHUB_OUTPUT"

  pr-auto-assign:
    needs: prepare-config
    if: ${{ needs.prepare-config.outputs.restricted-actor != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check if PR is from a fork
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.event.pull_request.base.repo.full_name }}" ]; then
            echo "⚠️ Pull request is from a fork — skipping assignee assignment (no write permissions)."
            exit 0
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: netcracker/qubership-workflow-hub/actions/pr-assigner@27fd7674286e5f561a6fd8277f2f389ff96ddb9e # v2.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
